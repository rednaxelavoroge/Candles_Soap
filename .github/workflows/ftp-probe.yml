# Разведка хостинга: куда ведёт FTP-доступ и что там лежит.
#
# Нужна была один раз — перед переездом панели, чтобы понять, в какую папку
# её класть: внутрь папки сайта нельзя (её содержимое отдаётся в интернет),
# а точный путь из секретов не виден.
#
# Ничего не меняет, только смотрит. Запускается вручную.
# Когда переезд закончится, файл можно удалить.

name: Разведка хостинга

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Осмотреться на хостинге
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          echo "Папка сайта из секрета FTP_DIR: ${FTP_DIR:-（не задана）}"
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<'LFTP'
            set ssl:verify-certificate no
            set ftp:ssl-allow yes
            echo "=== ГДЕ МЫ ОКАЗАЛИСЬ ==="
            pwd
            echo "=== ЧТО ЗДЕСЬ ==="
            cls -l
            echo "=== УРОВНЕМ ВЫШЕ ==="
            cls -l ..
            echo "=== ДВА УРОВНЯ ВЫШЕ ==="
            cls -l ../..
            bye
          LFTP
