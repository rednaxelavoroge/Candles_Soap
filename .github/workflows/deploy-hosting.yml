# Выкладка публичного сайта на обычный хостинг по FTP.
#
# Зачем. На Vercel сайт в России открывается еле-еле — дело в маршруте до
# серверов Vercel, настройками это не лечится. Хостинг, где стоит
# annamanasaryan.com, в России работает нормально, поэтому людям сайт
# отдаётся оттуда.
#
# Пароль от FTP хранится в секретах репозитория и в коде не появляется.
# Разработчик его не видит.
#
# Что происходит: при каждом изменении в main сайт пересобирается статикой
# и заливается на хостинг. Это же работает и для правок из админки —
# она сохраняет данные коммитом в репозиторий, значит после её правки
# сайт на хостинге обновится сам.

name: Выложить сайт на хостинг

on:
  push:
    branches: [main]
  # Позволяет запустить выкладку вручную кнопкой во вкладке Actions.
  workflow_dispatch:

# Две выкладки разом ссорятся на хостинге: каждая держит по четыре
# FTP-соединения, сервер столько не даёт, и вторая падает на середине.
# Так сегодня дважды и вышло — правка была в репозитории, а на сайте нет.
# Теперь очередь: следующая выкладка ждёт, пока закончится текущая.
concurrency:
  group: deploy-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Проверить, заданы ли доступы
        id: check
        run: |
          if [ -z "${{ secrets.FTP_HOST }}" ]; then
            echo "Секрет FTP_HOST не задан — выкладка пропущена."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Установить зависимости
        if: steps.check.outputs.ready == 'true'
        run: npm ci

      - name: Собрать статику
        if: steps.check.outputs.ready == 'true'
        run: npm run build:static

      - name: Залить на хостинг
        if: steps.check.outputs.ready == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Папка на хостинге. Если секрет не задан, берётся public_html.
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          TARGET="${FTP_DIR:-public_html}"
          echo "Заливаю в $TARGET на $FTP_HOST"
          # mirror -R: из локальной папки на сервер.
          # --parallel: несколько файлов разом, иначе 300 файлов льются долго.
          #
          # Флага --delete здесь намеренно нет. В папке домена annamanasaryan.art
          # на хостинге лежит рабочий WordPress, и удаление лишнего снесло бы
          # его целиком. Выкладка только добавляет и обновляет свои файлы,
          # чужого не трогает.
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<LFTP
            set ssl:verify-certificate no
            set ftp:ssl-allow yes
            mirror -R --parallel=4 --verbose out "$TARGET"
            bye
          LFTP

      # Убрать с хостинга то, что удалили из панели.
      #
      # Выкладка идёт без --delete (в папке домена чужой WordPress), поэтому
      # сама она ничего не убирает. Панель, удаляя ролик, стирает файл с
      # хостинга сразу — но если в эту минуту уже шла выкладка, начатая ДО
      # удаления, она успевает положить файл обратно. Проверено 09.09.2026:
      # ролик, удалённый в 19:51, вернулся на хостинг в 19:52 выкладкой,
      # стартовавшей раньше, и остался там навсегда — из репозитория он к тому
      # времени уже пропал, и убрать его было некому.
      #
      # Поэтому панель, кроме удаления файла, записывает путь в
      # src/data/removed-from-site.json, а этот шаг проходит по списку после
      # каждой выкладки. «Нет такого файла» — норма: значит, уже убрано.
      - name: Убрать удалённое из панели
        if: steps.check.outputs.ready == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          set -euo pipefail
          LIST=src/data/removed-from-site.json
          if [ ! -f "$LIST" ]; then
            echo "Списка удалённого нет — убирать нечего."
            exit 0
          fi

          TARGET="${FTP_DIR:-public_html}"

          # Пути приходят из панели. Чужого и вышестоящего здесь быть не может:
          # берём только то, что лежит внутри catalog, и отбрасываем «..».
          python3 - "$LIST" > /tmp/remove-commands.txt <<'PY'
          import json, sys
          out = []
          try:
              items = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception as err:
              print(f"# список не прочитан: {err}", file=sys.stderr)
              items = []
          for item in items if isinstance(items, list) else []:
              path = item.get("path") if isinstance(item, dict) else item
              if not isinstance(path, str):
                  continue
              path = path.lstrip("/")
              if not path.startswith("catalog/") or ".." in path:
                  continue
              out.append(f'rm -f "{path}"')
          print("\n".join(out))
          PY

          COUNT=$(grep -c . /tmp/remove-commands.txt || true)
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "В списке нет ничего, что нужно убрать."
            exit 0
          fi
          echo "Убираю с хостинга $COUNT файл(ов)."

          {
            echo "set ssl:verify-certificate no"
            echo "set ftp:ssl-allow yes"
            echo "set cmd:fail-exit no"
            echo "cd \"$TARGET\""
            cat /tmp/remove-commands.txt
            echo "bye"
          } | lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" || true
          echo "Готово."
