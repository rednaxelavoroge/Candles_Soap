# Выложить фотосайт Anna_photo в document root .com.
# FTP-секреты те же, что у .art, но логин почти всегда сразу в папке .art.
# Папку annamanasaryan.art НЕ трогаем: если в цели есть catalog/ и brand/ — стоп.
#
# Только вручную (workflow_dispatch). В коммит пишите [skip ci], иначе
# push в main запустит ещё и выкладку свечей и упрётся в лимит FTP.

name: Deploy photo site to .com

on:
  workflow_dispatch:

concurrency:
  group: deploy-photo-com
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout photographer site
        uses: actions/checkout@v4
        with:
          repository: rednaxelavoroge/Anna_photo
          ref: cursor/namecheap-static-f40b

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and export
        run: |
          npm ci
          npm run export:namecheap

      - name: Upload to .com public_html and remove WordPress
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${FTP_HOST:-}" ]; then
            echo "FTP_HOST missing"
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          test -f out/index.html
          test -f out/.htaccess

          lftp_script() {
            lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<LFTP
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set net:max-retries 3
          set net:timeout 30
          $1
          bye
          LFTP
          }

          listing_of() {
            local dest="$1"
            lftp_script "set cmd:fail-exit yes
          cd $dest
          echo PWD_OK
          cls -1" || true
          }

          is_art() {
            echo "$1" | grep -E -q '^catalog/' && echo "$1" | grep -E -q '^brand/'
          }

          is_wp() {
            echo "$1" | grep -E -q '^(wp-admin|wp-content|wp-includes)/' || echo "$1" | grep -q '^wp-config.php'
          }

          TARGET=""
          for cand in "." ".." "../.." "../../public_html" "../public_html" "public_html" "/home/annaclvt/public_html"; do
            echo "=== probe $cand ==="
            LIST=$(listing_of "$cand")
            echo "$LIST" | head -80
            if ! echo "$LIST" | grep -q 'PWD_OK'; then
              echo "skip $cand (cannot cd)"
              continue
            fi
            if is_art "$LIST"; then
              echo "skip $cand (this is .art candles tree)"
              continue
            fi
            if is_wp "$LIST"; then
              TARGET="$cand"
              echo "FOUND .com WordPress at $cand"
              break
            fi
          done

          if [ -z "$TARGET" ]; then
            echo "FTP account cannot see .com document root. Need main cPanel FTP or an account jailed to public_html of annamanasaryan.com."
            exit 1
          fi

          GUARD=$(listing_of "$TARGET")
          if is_art "$GUARD"; then
            echo "Refusing to upload: $TARGET still looks like .art"
            exit 1
          fi
          echo "Using FTP target: $TARGET"

          echo "=== upload static site ==="
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<LFTP
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set net:max-retries 3
          set net:timeout 30
          set cmd:fail-exit yes
          cd $TARGET
          pwd
          mirror -R --parallel=4 --verbose --exclude-glob .DS_Store out .
          rm -f index.php xmlrpc.php license.txt readme.html
          glob -a rm wp-*.php
          rm -r -f wp-admin
          rm -r -f wp-includes
          bye
          LFTP

          echo "=== remove wp-content/media if present ==="
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<LFTP || true
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set net:max-retries 2
          set net:timeout 60
          cd $TARGET
          rm -r -f wp-content
          rm -r -f media
          bye
          LFTP

          echo "=== remaining top-level names ==="
          listing_of "$TARGET"
