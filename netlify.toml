# Зеркало публичного сайта. Нужно потому, что на Vercel сайт в России
# грузится еле-еле: дело не в весе страницы, а в маршруте до серверов Vercel.
#
# Собирается только публичная часть: админка (/admin и /api/admin/*) —
# серверная, в статику не выгружается и остаётся на Vercel.
[build]
  command = "npm run build:static"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
